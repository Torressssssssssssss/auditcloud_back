name: auditcloud

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: auditcloud_db
      MYSQL_USER: ${DB_USER:?Define DB_USER en el archivo .env de la raíz}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env de la raíz}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el archivo .env de la raíz}
      TZ: UTC
    volumes:
      - datos_mysql:/var/lib/mysql
      - ./docker/mysql/01_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" "$${MYSQL_DATABASE}"
          --execute="SELECT 1 FROM app_sequences LIMIT 0"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: auditcloud_db
      DB_USER: ${DB_USER:?Define DB_USER en el archivo .env de la raíz}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env de la raíz}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env de la raíz}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-false}
      TZ: UTC
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - archivos_evidencias:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const solicitud = require('node:http').get('http://127.0.0.1:3000/api/mysql/health', respuesta =>
          {
            respuesta.resume();
            process.exit(respuesta.statusCode === 200 ? 0 : 1);
          });
          solicitud.on('error', () => process.exit(1));
          solicitud.setTimeout(4000, () =>
          {
            solicitud.destroy();
            process.exit(1);
          });
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ../auditcloud_front
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/salud]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  datos_mysql:
  archivos_evidencias:
