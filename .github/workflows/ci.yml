name: AuditCloud CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar análisis de vulnerabilidades
        run: npm audit --audit-level=high || true

      - name: Ejecutar Linting
        run: npm run lint || echo "Linting pendiente de configurar, saltando paso temporalmente"

      - name: Ejecutar pruebas unitarias
        run: node --test test/unit/*.test.js test/unit/**/*.test.js

      - name: Ejecutar pruebas de integración
        run: node --test test/integration/*.test.js

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Empaquetar proyecto en contenedor Docker
        run: docker build -t auditcloud-back:${{ github.sha }} .
