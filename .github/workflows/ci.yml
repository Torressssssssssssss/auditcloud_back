name: AuditCloud CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga de código fuente (5%)
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4

      # 2. Configuración del entorno y dependencias (5%)
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      
      - name: Instalar dependencias
        run: npm ci

      # 3. Análisis de Vulnerabilidades (15%)
      - name: Ejecutar análisis de vulnerabilidades
        run: npm audit --audit-level=high

      # 4. Análisis estático de código (Linting) (15%)
      - name: Ejecutar Linting
        run: npm run lint

      # 5. Pruebas Unitarias (15%)
      - name: Ejecutar pruebas unitarias
        run: node --test test/unit/*.test.js test/unit/**/*.test.js

      # 6. Pruebas de Integración (20%)
      - name: Ejecutar pruebas de integración
        run: node --test test/integration/*.test.js

      # 7. Empaquetado del proyecto (25%)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Empaquetar proyecto en contenedor Docker
        run: docker build -t auditcloud-back:${{ github.sha }} .
      
      - name: Desplegar en DigitalOcean
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: MYSQL_ROOT_PASSWORD
          script: |
            cd ~/auditcloud/stable/auditcloud_back
            git pull origin main
            export MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
            docker compose up -d --build
            docker system prune -f
